<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="theme-color" content="#f7f9f9">
<title>PIH Guard</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Pretendard";src:url("fonts/Pretendard-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Pretendard";src:url("fonts/Pretendard-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Pretendard";src:url("fonts/Pretendard-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{color-scheme:light;--bg:#f7f9f9;--surface:#fff;--ink:#1b2326;--muted:#66737c;--line:#e4e8ea;--soft:#f0f3f4;--band:#e3ecee;
--accent:#1d5c6e;--red:#c2455a;--brown:#8b5a3a;--ok:#2f7d55;--warn:#b06d12;--crit:#b23a48;
--sans:"Pretendard",-apple-system,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 86px) max(16px,env(safe-area-inset-left))}
header.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
header.top .brand{font-weight:700;font-size:1.15rem;letter-spacing:-.01em;display:flex;gap:8px;align-items:center}
header.top .who{font-size:.8rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
h2{font-size:1.05rem;margin:0}
h3{font-size:.9rem;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.row{flex-wrap:nowrap;align-items:flex-start}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.02em}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.watch{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.crit{background:color-mix(in srgb,var(--crit) 18%,transparent);color:var(--crit)}
.pill.crust{background:var(--soft);color:var(--muted)}
.big{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:var(--soft);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-size:.7rem;color:var(--muted);font-weight:600}
.kv span{font-weight:700;font-variant-numeric:tabular-nums}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 14px;background:var(--accent);color:#fff;cursor:pointer;text-align:center}
button.ghost{background:var(--soft);color:var(--ink)}
button.small{padding:7px 10px;font-size:.82rem;border-radius:9px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;font-size:.9rem}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--soft);color:var(--muted)}
.step.on i{background:var(--accent);color:#fff}
.step.done i{background:var(--ok);color:#fff}
canvas.photo{width:100%;border-radius:12px;background:#000;touch-action:manipulation;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:.85rem;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted);min-width:0}
select,input,textarea{font:inherit;font-size:.92rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2 .full{grid-column:1/-1}
svg text{font-family:var(--sans)}
.log{display:flex;flex-direction:column}
.log div{display:grid;grid-template-columns:48px 76px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.85rem}
.log .d{color:var(--muted);font-variant-numeric:tabular-nums}
.log .k{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.k.sense{color:#3a68ad}.k.interpret{color:var(--warn)}.k.intervene{color:var(--red)}.k.adapt{color:var(--ok)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;width:100%}
nav.tabs button{background:none;color:var(--muted);border-radius:0;padding:10px 4px 12px;font-size:.74rem;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:9}
.note{font-size:.78rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.hero{text-align:center;padding:28px 0 18px;display:flex;flex-direction:column;align-items:center;gap:8px}
.hero h1{margin:0;font-size:1.6rem;letter-spacing:-.02em}
button.wide{width:100%;margin-top:8px;padding:14px}
.navrow{gap:8px}.navrow button{flex:1;padding:14px}
.stepno{margin:0 0 8px 2px;font-weight:600;letter-spacing:.02em}
.sec{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 -2px}
details summary{cursor:pointer}
.done-mark{display:flex;gap:10px;align-items:center}
.alert{border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.tag{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--muted);vertical-align:middle;white-space:nowrap}
.tag.lit{background:color-mix(in srgb,#3a68ad 14%,transparent);color:#3a68ad}
.tag.weak{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.clinic{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.sim{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.tag.real{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.banner{font-size:.8rem;border-radius:10px;padding:9px 12px;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line))}
.ro{display:grid;grid-template-columns:118px 1fr;gap:6px 10px;font-size:.88rem}
.ro b{color:var(--muted);font-weight:600;font-size:.8rem}
.tbl{width:100%;border-collapse:collapse;font-size:.8rem}
.tbl th,.tbl td{text-align:left;padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.imgs figure{margin:0}.imgs img{width:100%;border-radius:10px;display:block}
.imgs figcaption{font-size:.72rem;color:var(--muted);margin-top:3px}
.brief{display:flex;flex-direction:column;gap:8px}
.brief div{display:grid;grid-template-columns:74px 1fr;gap:8px;font-size:.9rem}
.brief>div>b{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.guide li{margin:0 0 7px;font-size:.88rem}
.guide{padding-left:18px;margin:0}
.scale{display:flex;gap:6px}.scale button{flex:1;padding:7px 0;font-size:.82rem;background:var(--soft);color:var(--ink);border-radius:9px}
.scale button[aria-pressed="true"]{background:var(--accent);color:#fff}
.tl{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
.tl span{height:26px;border-radius:5px;background:var(--soft);font-size:.62rem;display:grid;place-items:center;color:var(--muted);font-variant-numeric:tabular-nums}
.tl span.ok{background:color-mix(in srgb,var(--ok) 30%,transparent);color:var(--ink)}
.tl span.watch{background:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink)}
.tl span.crit{background:color-mix(in srgb,var(--crit) 40%,transparent);color:var(--ink)}
.tl span.hold{background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 3px,var(--line) 3px,var(--line) 6px)}
.tl span.now{outline:2px solid var(--accent)}
.tl span.visit{border:2px dashed var(--accent)}
.prog{height:4px;background:var(--soft);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.72rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.menu{position:absolute;right:0}
.dash{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.dash li{padding-left:14px;position:relative}.dash li::before{content:"-";position:absolute;left:0;color:var(--muted)}
.card{box-shadow:0 1px 2px rgba(20,40,50,.04)}
.linkish{background:none;color:var(--accent);padding:0;font-weight:600}
header.top .brand{background:none;color:var(--ink);padding:4px 0;border-radius:8px}
/* example mode: orange bar + orange frame so it never looks like your own data */
:root{--ex:#c76a12}
#exBanner{position:sticky;top:0;z-index:6;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--ex);color:#fff;border:0;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.8rem}
#exBanner div{display:flex;flex-direction:column;gap:2px}#exBanner b{font-size:.9rem}#exBanner span{opacity:.92}
#exBanner button{background:#fff;color:var(--ex);flex:none;padding:9px 12px;font-size:.85rem}
body.exmode .app{box-shadow:inset 0 0 0 3px var(--ex)}
body.exmode nav.tabs{border-top:3px solid var(--ex)}
body.exmode nav.tabs button[aria-current="page"]{color:var(--ex)}
.path .sec{margin:0}
.expath{border:2px dashed var(--ex)}
.expath .sec{color:var(--ex)}
button.exbtn{background:var(--ex)}button.exbtn.ghost{background:color-mix(in srgb,var(--ex) 14%,transparent);color:var(--ex)}
.imgs.ba img,.imgs.ba canvas{aspect-ratio:3/2;object-fit:cover}
.viz{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.gauge .gv{font-weight:700;font-variant-numeric:tabular-nums}
.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles div{display:flex;flex-direction:column;gap:1px;border-left:4px solid var(--ok)}
.tiles div.twarn{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--soft))}
.tiles i{font-style:normal;font-size:.7rem;color:var(--muted)}
details.care{border-top:1px solid var(--line);padding:10px 0 2px}
details.care summary{font-weight:700;font-size:.95rem;list-style:none;display:flex;justify-content:space-between}
details.care summary::-webkit-details-marker{display:none}
details.care summary::after{content:"+";color:var(--muted);font-weight:400}
details.care[open] summary::after{content:"\2212"}
details.care ul{margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="brand" id="homeBtn"><img src="icon.svg" width="26" height="26" alt="">PIH Guard</button>
    <div class="row"><span class="who" id="who"></span><button class="small ghost" id="moreBtn" aria-label="More">More</button></div>
  </header>
  <div id="exBanner" class="banner" hidden></div>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-go="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Today</button>
  <button data-go="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/></svg>Check-in</button>
  <button data-go="course"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Course</button>
  <button data-go="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Report</button>
</div></nav>
<script src="app.js?v=10"></script>
</body>
</html>
